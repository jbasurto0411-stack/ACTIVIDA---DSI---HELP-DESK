<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registro de incidentes Help Desk">
    <title>Reportar Incidente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <figure>
        <img src="assets/img/logo-helpdesk.png" alt="Logo Help Desk">
    </figure>
    <h1>Reportar Incidente</h1>

    <nav aria-label="Menú principal">
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="reporte.html">Reportar Incidente</a></li>
            <li><a href="tickets.html">Tickets</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h2>Formulario de Registro</h2>

        <article>
            <h3>Datos del Incidente</h3>

            <form action="#" method="post">
                <p>
                    <label for="titulo">Título del incidente:</label>
                    <input type="text" id="titulo" name="titulo" required maxlength="100">
                </p>

                <p>
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="red">Red</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                    </select>
                </p>

                <fieldset>
                    <legend>Nivel de Prioridad</legend>

                    <input type="radio" id="alta" name="prioridad" value="Alta" required>
                    <label for="alta">Alta</label>

                    <input type="radio" id="media" name="prioridad" value="Media">
                    <label for="media">Media</label>

                    <input type="radio" id="baja" name="prioridad" value="Baja">
                    <label for="baja">Baja</label>
                </fieldset>

                <p>
                    <label for="descripcion">Descripción:</label>
                    <textarea id="descripcion" name="descripcion" rows="6" required></textarea>
                </p>

                <p>
                    <button type="submit" class="btn btn-primary">Registrar Incidente</button>
                </p>
            </form>
        </article>
    </section>
</main>

<footer>
    <p>&copy; 2026 Sistema Help Desk - Universidad Técnica de Manabí</p>
</footer>

</body>
</html>
